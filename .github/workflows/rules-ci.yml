name: Security rules CI
on:
  pull_request:
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - rules-tests/**
      - .github/workflows/rules-ci.yml
permissions:
  contents: read
jobs:
  rules:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --prefix rules-tests
      # Runs against local emulators with a demo project id. No credentials,
      # no deploy: this job never touches the real Firebase project.
      - run: npm test --prefix rules-tests
