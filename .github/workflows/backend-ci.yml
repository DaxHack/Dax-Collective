name: Backend CI
on: pull_request
permissions:
  contents: read
jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dax-backend/package-lock.json
      - run: npm ci --prefix dax-backend
      - run: npm --prefix dax-backend run lint:check
      - run: npm test --prefix dax-backend
