name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      CI: false
      # Public HTTPS origin of the deployed backend (repository variable, not a
      # secret: it ships in the bundle). Empty or unset keeps every
      # backend-dependent feature in its "unavailable" state.
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm ci --prefix dax-main && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAX_COLLECTIVE }}
          projectId: dax-collective
