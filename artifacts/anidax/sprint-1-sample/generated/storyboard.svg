<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05050A"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1650" cy="180" r="220" fill="#00D4FF" opacity="0.12"/>
  <circle cx="210" cy="930" r="280" fill="#8B5CF6" opacity="0.12"/>
  <text x="120" y="105" fill="#ffffff" font-family="Arial" font-size="58" font-weight="900">ANI-DAX SPRINT 1 STORYBOARD</text>
  <text x="120" y="145" fill="#00D4FF" font-family="Arial" font-size="26">Return by Death Is Not Subaru's Power - It Is the Price</text>
  
        <rect x="120" y="170" width="1680" height="120" rx="22" fill="#111827" stroke="#1f9cf0" opacity="0.82"/>
        <text x="165" y="208" fill="#00D4FF" font-family="Arial" font-size="30" font-weight="700">0-4s</text>
        <text x="165" y="248" fill="#ffffff" font-family="Arial" font-size="34">Is this power, or punishment?</text>
        <text x="760" y="212" fill="#d8b4fe" font-family="Arial" font-size="26">Original motion graphic</text>
        <text x="760" y="252" fill="#d1d5db" font-family="Arial" font-size="24">Black field, cyan reset loop, single question card.</text>

        <rect x="120" y="330" width="1680" height="120" rx="22" fill="#111827" stroke="#1f9cf0" opacity="0.82"/>
        <text x="165" y="368" fill="#00D4FF" font-family="Arial" font-size="30" font-weight="700">4-10s</text>
        <text x="165" y="408" fill="#ffffff" font-family="Arial" font-size="34">Control is removed.</text>
        <text x="760" y="372" fill="#d8b4fe" font-family="Arial" font-size="26">Original vector/motion graphic</text>
        <text x="760" y="412" fill="#d1d5db" font-family="Arial" font-size="24">Timeline fractures into three paths, only one path remains lit.</text>

        <rect x="120" y="490" width="1680" height="120" rx="22" fill="#111827" stroke="#1f9cf0" opacity="0.82"/>
        <text x="165" y="528" fill="#00D4FF" font-family="Arial" font-size="30" font-weight="700">10-16s</text>
        <text x="165" y="568" fill="#ffffff" font-family="Arial" font-size="34">What did the last version lose?</text>
        <text x="760" y="532" fill="#d8b4fe" font-family="Arial" font-size="26">Original composition</text>
        <text x="760" y="572" fill="#d1d5db" font-family="Arial" font-size="24">Interview table silhouette, empty second chair, recorder waveform.</text>

        <rect x="120" y="650" width="1680" height="120" rx="22" fill="#111827" stroke="#1f9cf0" opacity="0.82"/>
        <text x="165" y="688" fill="#00D4FF" font-family="Arial" font-size="30" font-weight="700">16-23s</text>
        <text x="165" y="728" fill="#ffffff" font-family="Arial" font-size="34">The plot resets. The burden does not.</text>
        <text x="760" y="692" fill="#d8b4fe" font-family="Arial" font-size="26">Original motion graphic</text>
        <text x="760" y="732" fill="#d1d5db" font-family="Arial" font-size="24">Memory cards stack up behind the narrator frame.</text>

        <rect x="120" y="810" width="1680" height="120" rx="22" fill="#111827" stroke="#1f9cf0" opacity="0.82"/>
        <text x="165" y="848" fill="#00D4FF" font-family="Arial" font-size="30" font-weight="700">23-30s</text>
        <text x="165" y="888" fill="#ffffff" font-family="Arial" font-size="34">READY FOR DANIEL REVIEW</text>
        <text x="760" y="852" fill="#d8b4fe" font-family="Arial" font-size="26">Brand card</text>
        <text x="760" y="892" fill="#d1d5db" font-family="Arial" font-size="24">Ani-Dax title lockup, no upload CTA until approval.</text>
</svg>
